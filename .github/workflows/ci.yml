# 강남드림 CI — 푸시마다 정적 감사 + 밸런스 회귀 + Godot 헤드리스 컴파일/시뮬.
# 로컬(클라우드 세션)에는 Godot가 없어 컴파일 체크가 스킵되므로, CI가 그 구멍을 메운다.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: "4.6.2"

jobs:
  audit:
    name: 정적 감사 + 밸런스 회귀
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: audit.py (정적 감사 7종)
        run: python3 tools/audit.py
      - name: balance_check.py (밸런스 밴드)
        run: python3 tools/balance_check.py

  godot:
    name: Godot 헤드리스 컴파일 + 경제 시뮬
    runs-on: ubuntu-latest
    steps:
      # art_master_audit.py는 art_master_manifest.json의 source_ref 커밋을
      # `git show <ref>:<경로>`로 열어 승격 원화의 검수 원본과 대조한다. 기본
      # 얕은 클론에는 그 커밋이 없어 ART_MASTER_EXIT이 항상 실패한다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Godot ${{ env.GODOT_VERSION }} 설치
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: GUI 입력 런타임 확인
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          xvfb-run --help >/dev/null
      # .godot/은 .gitignore 대상이라 새 클론에는 임포트 캐시도, class_name 전역
      # 목록(.godot/global_script_class_cache.cfg)도 없다. 이 단계가 없으면
      # 폰트·오디오가 res://.godot/imported/*에서 로드 실패하고 FontKit·ModLoader·
      # TutorialOverlay가 미선언이 되어 오토로드가 Nil로 죽는다. audit.sh는
      # 오토로드와 class_name이 모두 등록된 상태를 전제한다(tools/audit.sh 참조).
      - name: 자산 임포트 (.godot 캐시·class_name 전역 생성)
        run: |
          godot --headless --import --quit-after 2000 2>&1 | tail -30 || true
          test -f .godot/global_script_class_cache.cfg \
            || { echo "::error::임포트 후에도 class_name 전역 캐시가 없다"; exit 1; }
      - name: 전체 감사 (컴파일 체크 포함)
        run: GODOT=/usr/local/bin/godot ./tools/audit.sh
      - name: V2 24주 실제입력 완주 (한국어 PlayStation)
        run: |
          GODOT=godot GANGNAM_QA_XVFB=1 \
            GANGNAM_QA_TIMEOUT_SECONDS=420 \
            GANGNAM_QA_LOG="${GITHUB_WORKSPACE}/core-loop-v2-ko.log" \
            GANGNAM_QA_OUT="${GITHUB_WORKSPACE}/qa-artifacts/ko" \
            ./tools/run_core_loop_v2_input_qa.sh ko-gamepad
      - name: V2 24주 실제입력 완주 (영어 키보드)
        run: |
          GODOT=godot GANGNAM_QA_XVFB=1 \
            GANGNAM_QA_TIMEOUT_SECONDS=420 \
            GANGNAM_QA_LOG="${GITHUB_WORKSPACE}/core-loop-v2-en.log" \
            GANGNAM_QA_OUT="${GITHUB_WORKSPACE}/qa-artifacts/en" \
            ./tools/run_core_loop_v2_input_qa.sh en-keyboard
      - name: V2 실제입력 로그·완료 화면 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-loop-v2-input-${{ github.run_attempt }}
          path: |
            core-loop-v2-*.log
            qa-artifacts/**/*.png
          if-no-files-found: warn
      - name: SimRun 경제 시뮬 (240주 완주·정수 원장 검증)
        run: |
          mkdir -p "$RUNNER_TEMP/gangnam-simrun-home"
          HOME="$RUNNER_TEMP/gangnam-simrun-home" GANGNAM_SIMRUN_ISOLATED=1 \
            godot --headless res://tools/SimRun.tscn 2>&1 | tee simrun.log
          # 데드락/크래시가 있으면 로그에 잡힌다 — 0이 아니면 실패
          ! grep -E "데드락의심: [1-9]|크래시\(가드\): [1-9]" simrun.log
          grep -q '^SIMRUN_CASH_INTEGRITY_OK ' simrun.log
      - name: SmokeRace 경마 스모크
        run: godot --headless res://tools/SmokeRace.tscn
