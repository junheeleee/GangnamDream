# 현황 대시보드 — main이 바뀔 때마다 다시 만들어 GitHub Pages에 올린다.
#
# 왜 CI가 하는가: 사람이나 에이전트가 갱신하는 현황판은 갱신을 잊는 순간
# 거짓말이 된다. 아무도 손대지 않아도 항상 최신이어야 의미가 있으므로
# 저장소가 바뀌는 사건에 직접 건다.
#
# 최초 1회만 사람이 켠다: Settings → Pages → Source = "GitHub Actions".
# 그전까지 deploy 단계는 실패하지만 build 단계의 아티팩트는 남으므로
# Actions 탭에서 내려받아 볼 수 있다.
#
# **저장소가 공개이므로 Pages도 공개다.** 이 화면은 tint·route와 정확한 수치를
# 그대로 보여 준다. 같은 값이 이미 content/*.json 에 공개돼 있어 새로 새는 정보는
# 없지만, 검색되는 렌더 페이지는 원본 JSON과 성격이 다르다. 그래서 noindex를 넣고,
# 켜는 행위 자체를 사람 손에 남긴다 — 이 워크플로만으로는 아무것도 공개되지 않는다.
name: Dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 동시에 두 번 배포되지 않게 한다. 뒤에 온 것이 이긴다 — 현황판은
# 최신만 의미가 있으므로 진행 중인 배포를 기다릴 이유가 없다.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 생성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: project_dashboard.py
        run: |
          mkdir -p site
          python3 tools/project_dashboard.py --out site/index.html
          test -s site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
